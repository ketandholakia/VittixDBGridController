name: Delphi 12 Win32

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: [self-hosted, Windows, delphi12]
    timeout-minutes: 30
    env:
      VITTIX_DELPHI_ROOT: 'C:\Program Files (x86)\Embarcadero\Studio\23.0'

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify Delphi installation
        shell: pwsh
        run: |
          if (-not (Test-Path (Join-Path $env:VITTIX_DELPHI_ROOT 'bin\rsvars.bat'))) {
            throw "Delphi 12 rsvars.bat was not found under $env:VITTIX_DELPHI_ROOT"
          }

      - name: Build packages
        shell: cmd
        run: |
          call "%VITTIX_DELPHI_ROOT%\bin\rsvars.bat" >nul || exit /b 1
          msbuild packages\VittixDBGridControllerR.dproj /p:Config=Release /p:Platform=Win32 /v:minimal /nologo || exit /b 1
          msbuild packages\VittixDBGridControllerFD.dproj /p:Config=Release /p:Platform=Win32 /v:minimal /nologo || exit /b 1
          msbuild packages\VittixDBGridControllerD.dproj /p:Config=Release /p:Platform=Win32 /v:minimal /nologo || exit /b 1

      - name: Build tests
        shell: cmd
        run: |
          call "%VITTIX_DELPHI_ROOT%\bin\rsvars.bat" >nul || exit /b 1
          msbuild tests\VittixDBGridTests.dproj /p:Config=Release /p:Platform=Win32 /v:minimal /nologo || exit /b 1

      - name: Run tests
        shell: pwsh
        run: |
          & .\tests\VittixDBGridTests.exe --hidebanner --xmlfile:tests\dunitx-results.xml --consolemode:Quiet
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: delphi12-win32-tests
          path: tests/dunitx-results.xml
          if-no-files-found: ignore
